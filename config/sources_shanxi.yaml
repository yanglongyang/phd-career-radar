# 山西招聘增量来源包。原 sources.yaml 保留；本包使用独立 id，按公告 URL 去重。
# 核验日期：2026-10-30。enabled=false 是已知覆盖缺口，不计入自动采集成功。
# 历史种子只在 history 模式运行；动态列表继续发现后续新公告。
schema_version: 1

collectors:
  - id: shanxi_sxu_faculty
    name: 山西大学教师招聘（正文与历年公告）
    type: html_list
    enabled: true
    sector: university
    organization: 山西大学
    province: 山西
    location: 山西
    url: https://rsc.sxu.edu.cn/gkzp/jszpzp/index.htm
    verified_at: '2026-10-30'
    verification_status: html_verified
    request: &shanxi_request
      timeout_seconds: 18
      user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
    max_age_days: 365
    require_date: true
    selectors:
      item: '.lm_list > ul > li'
      title: a
      link: a
      date: span
      title_require_words: [招聘, 诚聘, 引进, 博士后, 招收]
    pagination: {next_text: [下一页], max_pages: 2, max_items: 25}
    history: {enabled: true, years: 3, max_pages: 9, max_items: 60}
    detail: &vsb_detail
      fetch_detail: true
      content_selector: '#vsb_content_2, #vsb_content, .v_news_content'
    filters: &faculty_filters
      include_keywords: [招聘, 诚聘, 引进, 博士, 科研, 人才]
      exclude_keywords: [拟聘, 拟录用, 公示, 成绩, 资格审查, 资格复审, 面试公告, 体检, 考察, 递补, 附属子弟小学, 附属中学, 辅导员]

