  # 南京大学 hr.nju.edu.cn：页面 JS 渲染，静态抓取无内容
  # 中科院化学所 www.ic.cas.cn/rcjy/：栏目路径失效（404）
  # 西湖大学 westlake.edu.cn/careers：JS 渲染（500/空页）
  # 高校人才网 gaoxiaojob.com：反爬 403
  # 中科院人才网 www.cas.cn/rcjy：频道首页为导航，非招聘列表
  # 中科院上海有机所 sioc.ac.cn/rcjy/rczp：页面结构特殊，静态解析无列表项
  # 中国公共招聘网 www.job.mohrss.gov.cn：岗位列表 JS 渲染（仅静态表单），静态不可用
  # 华海药业 zpgw.html（企业候选）：岗位表为猎聘聚合且数据停留在 2023 年，非公司官方列表
  # 山西卫健委 wsjkw.shanxi.gov.cn：https 连接失败 / http 502，静态不可达
