# 招聘信息来源配置（V0.2 Collector MVP + V0.3 sector + V0.3.2 hospital + V0.3.3 跨学科扩展）
# CollectorRegistry/runner 读取 enabled 清单；真实爬虫仅 JsonApiCollector / HtmlListCollector。
# 关键词过滤为确定性 pre-filter；title_require_words 过滤混入列表页的导航/新闻动态；
# max_age_days 按列表发布日期跳过过期旧岗位；require_date=true 时无日期条目不进 Inbox。
#
# V0.3.3 目标画像：生物学博士，荧光探针/分子探针研究方向，横跨化学-生物（化学生物学、
# 生物成像、生物分析、分子诊断、药物发现、转化医学）。Coverage-first：宁可多召回让
# 用户人工忽略，也不要漏掉重要机会 —— include 词表按跨学科画像放宽，综合招聘公告
# （高层次人才/年度招聘/博士后招收）即使标题无专业词也保留；噪声（拟聘/公示/资格复审/
# 辅导员/行政…）继续过滤。
#
# sector：来源/单位性质分类（university / research_institute / hospital / state_owned /
#   enterprise / mixed / other），与 JobCategory 正交，不承载研究方向；发现时冻结。
#   research_institute 为 V0.3.3 独立 sector；大学附属医院招聘主体是医院 → hospital。
# category 为 legacy alias（兼容读取）；聚合来源 organization 留空（来源机构 ≠ 招聘单位）。
# schema_version 必须保留：程序据此区分 V0.1.1 legacy 空配置（自动迁移）与用户主动清空。
schema_version: 2

collectors:
  # ---- 高校（university）----
  - id: sxu_faculty
    name: 山西大学教师招聘
    type: html_list
    enabled: true
    sector: university
    organization: 山西大学
    url: https://rsc.sxu.edu.cn/gkzp/jszpzp/index.htm
    request:
      timeout_seconds: 20
    max_age_days: 365
    require_date: true   # 导航子菜单（教师招聘/博士后招聘…）无日期 span，直接排除
    selectors:
      item: "ul li"
      title: "a"
      link: "a"
      date: "span"
      title_require_words: [招聘, 诚聘, 教师, 教授, 岗位, 人才, 引进, 博士后, 研究员]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [招聘, 人才, 引进, 博士后, 招收, 教师, 教授, 研究员, 科研, 研究, 助理, 化学, 药学, 生物, 医学, 材料, 博士]
      exclude_keywords: [拟聘, 公示, 成绩, 面试, 资格审查, 资格复审, 体检, 考察, 递补, 辅导员, 管理岗位]

