# 招聘信息来源配置（V0.2 Collector MVP）
# CollectorRegistry/runner 读取 enabled 清单；真实爬虫仅 JsonApiCollector / HtmlListCollector。
# 关键词过滤为确定性 pre-filter（减少明显无关材料，不构成职业评价）。
# schema_version 必须保留：程序据此区分 V0.1.1 legacy 空配置（自动迁移）与
# 用户主动清空（尊重，不恢复默认）。
schema_version: 2

collectors:
  - id: nju_hr
    name: 南京大学人才招聘
    type: html_list
    enabled: true
    category: university
    organization: 南京大学
    url: https://hr.nju.edu.cn/zpgg/list.htm
    request:
      timeout_seconds: 15
    selectors:
      item: "ul.news_list li"
      title: "a"
      link: "a"
      date: "span"
    detail:
      fetch_detail: true
      content_selector: ".wp_articlecontent"
    filters:
      include_keywords: [化学, 药学, 生物, 医学, 材料, 教授, 研究员, 博士后]
      exclude_keywords: [辅导员, 行政, 后勤]

