  #   （连接失败 / 404 / 导航噪声），记录为候选
  # 石药集团 cspc.com.cn / 复星医药 fosunpharma.com / 凯莱英 / 华海药业（企业组）：
  #   官方 careers 均为 JS 应用或无静态列表 —— 企业组后续需要 JS 渲染型 collector
  #   （如 Playwright），本轮不做浏览器自动化，企业 sector 仅保留架构

