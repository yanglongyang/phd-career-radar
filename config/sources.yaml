# 招聘信息来源配置（V0.2 Collector MVP + V0.3 sector）
# CollectorRegistry/runner 读取 enabled 清单；真实爬虫仅 JsonApiCollector / HtmlListCollector。
# 关键词过滤为确定性 pre-filter；title_require_words 过滤混入列表页的导航/新闻动态；
# max_age_days 按列表发布日期跳过过期旧岗位（很多高校列表页新旧混排，2023/2016 的都有）。
#
# sector（V0.3）：来源/单位性质分类 —— university / state_owned / enterprise / mixed / other。
#   - 回答"这个岗位来自什么性质的用人单位/招聘来源"，与 JobCategory（岗位性质）正交；
#   - 是来源元数据，不是 AI 推断；发现时冻结到 DiscoveredJob.sector，之后改配置不回溯历史；
#   - mixed：一个 source 内可能同时包含多类单位，由 RawJob.sector_hint 逐条确定时覆盖；
#   - 聚合来源的 organization 留空（来源机构 ≠ 招聘单位），由每条材料自行提供。
# category 为 legacy alias（兼容读取，旧配置 category: university 不报错）；新配置统一写 sector。
# schema_version 必须保留：程序据此区分 V0.1.1 legacy 空配置（自动迁移）与
# 用户主动清空（尊重，不恢复默认）。
schema_version: 2

collectors:
  # ---- 高校（university）----
  - id: sjtu_postdoc
    name: 上海交通大学博士后招聘
    type: html_list
    enabled: true
    sector: university
    organization: 上海交通大学
    url: https://join.sjtu.edu.cn/Admin/ZPSpecialList.aspx?name=1
    request:
      timeout_seconds: 20
    max_age_days: 365
    selectors:
      item: "tr"
      title: "td:nth-of-type(2) a"
      link: "td:nth-of-type(2) a"
      date: "td:last-child"
      title_require_words: [招聘, 诚聘, 招收, 博士后, 岗位, 诚招, 引进]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 药学, 生物, 医学, 材料, 化工, 教授, 研究员, 博士后, 课题组]
      exclude_keywords: [辅导员, 行政, 后勤]

  - id: sjtu_research
    name: 上海交通大学研究队伍招聘
    type: html_list
    enabled: true
    sector: university
    organization: 上海交通大学
    url: https://join.sjtu.edu.cn/Admin/ZPSpecialList.aspx?name=5
    request:
      timeout_seconds: 20
    max_age_days: 365
    selectors:
      item: "tr"
      title: "td:nth-of-type(2) a"
      link: "td:nth-of-type(2) a"
      date: "td:last-child"
      title_require_words: [招聘, 诚聘, 招收, 博士后, 岗位, 诚招, 引进]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 药学, 生物, 医学, 材料, 化工, 教授, 研究员, 博士后, 课题组]
      exclude_keywords: [辅导员, 行政]

  - id: hust_faculty
    name: 华中科技大学专任教师招聘
    type: html_list
    enabled: true
    sector: university
    organization: 华中科技大学
    url: https://hr.hust.edu.cn/rczp/zrjszp.htm
    request:
      timeout_seconds: 20
    max_age_days: 365
    selectors:
      item: "ul.ss li"
      title: "a"
      link: "a"
      date: ""
      title_require_words: [招聘, 诚聘, 教师, 教授, 岗位, 人才, 引进]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 药学, 生物, 医学, 材料, 化工, 教师, 教授, 研究员, 人才]
      exclude_keywords: [辅导员, 行政, 后勤]

  - id: pku_rczp
    name: 北京大学人事处招聘公告
    type: html_list
    enabled: true
    sector: university
    organization: 北京大学
    url: https://hr.pku.edu.cn/
    request:
      timeout_seconds: 20
    max_age_days: 365
    selectors:
      # 首页 mode2Ul 是频道聚合：每条 li 的 dl dd 才是真实公告；
      # 分类标签（教学科研/行政教辅）在 title2 a 里，不在 dd 中。
      item: "ul.mode2Ul li dl dd"
      title: "a"
      link: "a"
      date: "a"
      date_attr: "title"   # 日期在 a 的 title 属性里："… 发布日期：2026-02-14"
      title_require_words: [招聘, 诚聘, 教师, 教授, 岗位, 人才, 引进, 博士后]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 药学, 生物, 医学, 材料, 教师, 教授, 研究员, 博士后, 人才]
      exclude_keywords: [辅导员, 行政, 值班, 公示, 面试名单, 名单, 请点此查看]

  # ---- 央国企（state_owned）----
  - id: sasac_recruit
    name: 国务院国资委招聘栏目
    type: html_list
    enabled: true
    sector: state_owned
    organization: null   # 聚合来源：来源机构（国资委）≠ 招聘单位（如中国航空工业集团）
    url: http://www.sasac.gov.cn/n2588035/n2588325/n2588350/index.html
    request:
      timeout_seconds: 20
    max_age_days: 365
    selectors:
      # 列表 li：<a>标题</a><span>[2026-07-31]</span>；
      # 页面含导航 ul（首页/机构概况…）与专题条目标题含"招聘" —— 用 exclude 词过滤。
      item: "ul li"
      title: "a"
      link: "a"
      date: "span"
      title_require_words: [招聘, 诚聘, 招收, 校园招聘, 社会招聘, 招聘公告, 岗位]
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 药学, 生物, 材料, 医药, 化工, 博士, 研发, 研究]
      exclude_keywords: [专题, 任免, 公示, 领导人员]

  # ---- 已禁用来源（unsupported / 结构不可用）----
  # 复旦大学 hr.fudan.edu.cn/15360/list.htm：列表为 JS 渲染/菜单结构，静态解析无公告条目
  # 南京大学 hr.nju.edu.cn：页面 JS 渲染，静态抓取无内容
  # 中科院化学所 www.ic.cas.cn/rcjy/：栏目路径失效（404）
  # 西湖大学 westlake.edu.cn/careers：JS 渲染（500/空页）
  # 高校人才网 gaoxiaojob.com：反爬 403
  # 中科院人才网 www.cas.cn/rcjy：频道首页为导航，非招聘列表
  # 中科院上海有机所 sioc.ac.cn/rcjy/rczp：页面结构特殊，静态解析无列表项
  # 中国公共招聘网 www.job.mohrss.gov.cn：岗位列表 JS 渲染（仅静态表单），静态不可用
  # 华海药业 zpgw.html（企业候选）：岗位表为猎聘聚合且数据停留在 2023 年，非公司官方列表

  - id: fudan_hr
