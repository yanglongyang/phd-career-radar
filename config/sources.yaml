    request:
      timeout_seconds: 15
    selectors:
      item: "ul.news_list li"
      title: "a"
      link: "a"
      date: "span"
    detail:
      fetch_detail: false
    filters:
      include_keywords: [化学, 生物, 医学, 材料, 教授, 研究员, 博士后]
      exclude_keywords: [辅导员, 行政]
